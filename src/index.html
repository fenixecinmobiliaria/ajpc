<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>JPC Electronics | Ingeniería Biomédica en Cuenca</title>
  <base href="/">
  <script>
    // Enlaces del sitio anterior (sin "#"), p. ej. /catalogo o /mantenimientolist:
    // se convierten a la ruta actual (/#/catalogo) para que abran su sección.
    (function () {
      var ruta = location.pathname.replace(/^\/+|\/+$/g, '');
      if (!ruta || ruta === 'index.html' || location.hash) return;
      var equivalentes = {
        mantenimientolist: 'mantenimiento', repotenciacionlist: 'repotenciacion',
        fabricacionlist: 'fabricacion', disenolist: 'diseno-inventor',
        productos: 'catalogo', contacto: 'home', acerca: 'home'
      };
      var primera = ruta.split('/')[0];
      if (equivalentes[primera]) ruta = equivalentes[primera];
      location.replace('/#/' + ruta + location.search);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Especialistas en Cuenca en la repotenciación, mantenimiento y fabricación de tecnología médica de alto rendimiento.">
  <meta name="keywords" content="Ingeniería Biomédica, Cuenca, JPC Electronics, Mantenimiento Médico, Repotenciación, Ambulancias Ecuador">
  <meta name="theme-color" content="#0a1120">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"></noscript>

  <link rel="icon" type="image/webp" href="assets/pestaJPC.webp">
</head>

</html>
